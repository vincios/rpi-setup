# Combined NetBird Server Configuration (Simplified)
# Generated by getting-started.sh

server:
  listenAddress: ":80"
  exposedAddress: "https://netbird.example.com:443"
  stunPorts:
    - 3478
  metricsPort: 9090
  healthcheckAddress: ":9000"
  logLevel: "info"
  logFile: "console"

  authSecret: "your-auth-secret-here"
  dataDir: "/var/lib/netbird"

  auth:
    issuer: "https://netbird.example.com/oauth2"
    signKeyRefreshEnabled: true
    dashboardRedirectURIs:
      - "https://netbird.example.com/nb-auth"
      - "https://netbird.example.com/nb-silent-auth"
    cliRedirectURIs:
      - "http://localhost:53000/"

  reverseProxy:
    trustedHTTPProxies:
      - "172.30.0.10/32"

  store:
    engine: "postgres"
    dsn: "host=database user=postgres password=your-password-here dbname=netbird_data port=5432"
    encryptionKey: "your-encryption-key-here"
  authStore:
    engine: "postgres"
    dsn: "host=database port=5432 user=postgres password=your-password-here dbname=netbird_auth sslmode=disable"
  activityStore:
    engine: "postgres"
    dsn: "host=database port=5432 user=postgres password=your-password-here dbname=netbird_events sslmode=disable"
